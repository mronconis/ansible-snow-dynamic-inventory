plugin: servicenow.itsm.now
instance:
  host: https://dev485064.service-now.com

table: cmdb_ci_server

columns:
  - name
  - host_name
  - fqdn
  - ip_address
  - sys_class_name
  - support_group
  - managed_by_group

keyed_groups:
  - key: support_group | default('unassigned', true)
    prefix: sn_group
    separator: "_"

strict: true